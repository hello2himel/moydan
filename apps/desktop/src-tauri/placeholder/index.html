<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moydan</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0b10;
        color: #e8e8f0;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { text-align: center; padding: 2rem; }
      .dot {
        width: 34px; height: 34px; margin: 0 auto 1.25rem;
        border-radius: 50%;
        border: 3px solid #2a2a38; border-top-color: #7c5cff;
        animation: spin 900ms linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .35rem; }
      p { margin: 0; color: #9a9ab0; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="dot"></div>
      <h1>Starting Moydan</h1>
      <p>The local instance is coming up. This screen disappears as soon as it is ready.</p>
    </main>
  </body>
</html>
