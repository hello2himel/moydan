<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the bottom navigation can respect the iOS home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0b12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Moydan: short, immediately playable browser games." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Inline data URI: the app must render fully offline, with no CDN requests. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Cpath d='M7 22V10l9 7.5L25 10v12' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>Moydan</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Moydan needs JavaScript to run games in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
